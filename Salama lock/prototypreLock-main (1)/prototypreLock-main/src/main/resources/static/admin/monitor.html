<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Health &amp; Logs — Salama Lock</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9b6a;
      --border: #2a3542;
      --warn: #c9a227;
      --danger: #d46565;
      --ok: #6fd39a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 70% 45% at 15% -5%, #1a3d2e 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky; top: 0; z-index: 5;
      background: rgba(15, 20, 25, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
    }
    .top {
      max-width: 1200px; margin: 0 auto;
      display: flex; flex-wrap: wrap; gap: 0.75rem 1rem;
      align-items: center; justify-content: space-between;
    }
    .brand { color: var(--accent); font-weight: 650; }
    .links a { color: var(--muted); text-decoration: none; margin-right: 0.85rem; font-size: 0.9rem; }
    .links a:hover { color: var(--accent); }
    main { max-width: 1200px; margin: 0 auto; padding: 1.25rem; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
      margin-bottom: 1rem;
    }
    .toolbar button, .toolbar label {
      background: transparent; color: var(--accent);
      border: 1px solid #2a5a42; border-radius: 8px;
      padding: 0.4rem 0.8rem; cursor: pointer; font: inherit; font-size: 0.9rem;
    }
    .toolbar label {
      display: inline-flex; align-items: center; gap: 0.4rem; color: var(--muted); cursor: pointer;
    }
    .toolbar input { accent-color: var(--accent); }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.95rem 1rem;
    }
    .card .label {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin-bottom: 0.35rem;
    }
    .card .value { font-size: 1.25rem; font-weight: 650; }
    .card .sub { color: var(--muted); font-size: 0.82rem; margin-top: 0.25rem; }
    .up { color: var(--ok); }
    .down { color: var(--danger); }
    .warn { color: var(--warn); }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 960px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
    }
    section.panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    section.panel h2 {
      margin: 0;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .table-wrap { overflow: auto; max-height: 360px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td {
      text-align: left; padding: 0.5rem 0.65rem;
      border-bottom: 1px solid var(--border); vertical-align: top;
    }
    th {
      position: sticky; top: 0; background: #151c24; color: var(--muted);
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em;
    }
    td.wrap { white-space: pre-wrap; word-break: break-word; max-width: 240px; }
    .empty, .error { padding: 1.25rem; color: var(--muted); }
    .error { color: #f0c4c4; }
    .status-SUCCESS, .status-LOCKED, .code-2xx { color: var(--ok); }
    .status-PENDING, .status-PROCESSING, .status-RETRYING, .code-3xx { color: var(--warn); }
    .status-FAILED, .code-4xx, .code-5xx { color: var(--danger); }
    .log-full {
      margin-top: 1rem;
    }
    .log-full .table-wrap { max-height: 480px; }
    details {
      margin: 0.15rem 0;
    }
    details summary {
      cursor: pointer; color: var(--accent); font-size: 0.78rem;
    }
    details pre {
      margin: 0.35rem 0 0;
      background: #121820;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      max-width: 420px;
      overflow: auto;
      font-size: 0.72rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
  <script src="/admin/admin-auth.js"></script>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand">Salama Lock · Health &amp; logs</div>
      <div class="links">
        <a href="/">Home</a>
        <a href="/guide">Guide</a>
        <a href="/admin">Issue key</a>
        <a href="/admin/companies">Companies</a>
        <a href="/admin/data">Database</a>
      </div>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btn-refresh">Refresh now</button>
      <label><input type="checkbox" id="auto-refresh" checked /> Auto-refresh (5s)</label>
      <span class="meta" id="last-updated">Not loaded yet</span>
    </div>

    <div class="cards" id="cards">
      <div class="card"><div class="label">Loading</div><div class="value">…</div></div>
    </div>

    <div class="grid-2">
      <section class="panel">
        <h2>Recent commands</h2>
        <div class="table-wrap" id="commands-wrap"><div class="empty">Loading…</div></div>
      </section>
      <section class="panel">
        <h2>Queue &amp; provider detail</h2>
        <div class="table-wrap" id="detail-wrap"><div class="empty">Loading…</div></div>
      </section>
    </div>

    <section class="panel log-full">
      <h2>Audit / request logs</h2>
      <div class="table-wrap" id="logs-wrap"><div class="empty">Loading…</div></div>
    </section>
  </main>

  <script>
(function () {
  var timer = null;
  var cardsEl = document.getElementById("cards");
  var commandsWrap = document.getElementById("commands-wrap");
  var detailWrap = document.getElementById("detail-wrap");
  var logsWrap = document.getElementById("logs-wrap");
  var updatedEl = document.getElementById("last-updated");
  var autoEl = document.getElementById("auto-refresh");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }

  function healthStatus(health) {
    if (!health) return "UNKNOWN";
    if (typeof health === "string") return health;
    return health.status || (health.getStatus && health.getStatus()) || "UNKNOWN";
  }

  function codeClass(code) {
    if (code == null) return "";
    var n = Number(code);
    if (n >= 200 && n < 300) return "code-2xx";
    if (n >= 300 && n < 400) return "code-3xx";
    if (n >= 400 && n < 500) return "code-4xx";
    if (n >= 500) return "code-5xx";
    return "";
  }

  function jsonBlock(obj) {
    if (obj == null) return "";
    var text = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
    if (!text || text === "{}") return "";
    return "<details><summary>payload</summary><pre>" + esc(text) + "</pre></details>";
  }

  function renderCards(data) {
    var h = healthStatus(data.health);
    var queue = data.queue || {};
    var provider = data.provider || {};
    var stats = data.statistics || {};
    var byStatus = stats.commandsByStatus || {};
    var backlog = (queue.pending || 0) + (queue.retrying || 0) + (queue.processing || 0);
    var healthCls = h === "UP" ? "up" : "down";
    var queueCls = backlog > 0 ? "warn" : "up";

    cardsEl.innerHTML =
      '<div class="card"><div class="label">App health</div><div class="value ' + healthCls + '">' + esc(h) + "</div>" +
        '<div class="sub">Actuator /actuator/health</div></div>' +
      '<div class="card"><div class="label">Active provider</div><div class="value">' + esc(provider.activeProvider || "–") + "</div>" +
        '<div class="sub">config: ' + esc(provider.configuredProvider || "–") + "</div></div>" +
      '<div class="card"><div class="label">Queue backlog</div><div class="value ' + queueCls + '">' + backlog + "</div>" +
        '<div class="sub">pending ' + (queue.pending || 0) +
        ' · retrying ' + (queue.retrying || 0) +
        ' · processing ' + (queue.processing || 0) +
        (queue.enabled === false ? " · DISABLED" : "") + "</div></div>" +
      '<div class="card"><div class="label">Devices</div><div class="value">' + (stats.devicesTotal || 0) + "</div>" +
        '<div class="sub">callbacks pending ' + (stats.pendingCallbacks || 0) + "</div></div>" +
      '<div class="card"><div class="label">Commands OK</div><div class="value up">' + (byStatus.SUCCESS || 0) + "</div>" +
        '<div class="sub">failed ' + (byStatus.FAILED || 0) + "</div></div>" +
      '<div class="card"><div class="label">In flight</div><div class="value warn">' +
        ((byStatus.PENDING || 0) + (byStatus.PROCESSING || 0) + (byStatus.RETRYING || 0)) + "</div>" +
        '<div class="sub">P ' + (byStatus.PENDING || 0) +
        ' / X ' + (byStatus.PROCESSING || 0) +
        ' / R ' + (byStatus.RETRYING || 0) + "</div></div>";
  }

  function renderCommands(rows) {
    if (!rows || !rows.length) {
      commandsWrap.innerHTML = '<div class="empty">No commands yet.</div>';
      return;
    }
    var html = "<table><thead><tr>" +
      "<th>When</th><th>Type</th><th>Status</th><th>IMEI</th><th>Ref</th><th>Error</th>" +
      "</tr></thead><tbody>";
    rows.forEach(function (r) {
      html += "<tr>" +
        "<td>" + esc(r.created_at) + "</td>" +
        "<td>" + esc(r.type) + "</td>" +
        '<td class="status-' + esc(r.status) + '">' + esc(r.status) + "</td>" +
        "<td>" + esc(r.imei) + "</td>" +
        "<td>" + esc(r.external_ref || "") + "</td>" +
        '<td class="wrap">' + esc(r.error_code || "") + (r.error_message ? " — " + esc(r.error_message) : "") + "</td>" +
        "</tr>";
    });
    html += "</tbody></table>";
    commandsWrap.innerHTML = html;
  }

  function renderDetail(data) {
    var queue = data.queue || {};
    var provider = data.provider || {};
    var stats = data.statistics || {};
    var health = data.health || {};
    var components = health.components || {};
    var db = components.db || components.diskSpace || null;
    var lines =
      "<table><tbody>" +
      "<tr><th>Health status</th><td class='" + (healthStatus(health) === "UP" ? "up" : "down") + "'>" + esc(healthStatus(health)) + "</td></tr>" +
      "<tr><th>Queue enabled</th><td>" + esc(String(queue.enabled)) + "</td></tr>" +
      "<tr><th>Pending</th><td>" + esc(queue.pending) + "</td></tr>" +
      "<tr><th>Retrying</th><td>" + esc(queue.retrying) + "</td></tr>" +
      "<tr><th>Processing</th><td>" + esc(queue.processing) + "</td></tr>" +
      "<tr><th>Provider active</th><td>" + esc(provider.activeProvider) + "</td></tr>" +
      "<tr><th>Provider configured</th><td>" + esc(provider.configuredProvider) + "</td></tr>" +
      "<tr><th>Devices total</th><td>" + esc(stats.devicesTotal) + "</td></tr>" +
      "<tr><th>Pending callbacks</th><td>" + esc(stats.pendingCallbacks) + "</td></tr>" +
      "</tbody></table>";
    if (components && Object.keys(components).length) {
      lines += "<table><thead><tr><th>Component</th><th>Status</th></tr></thead><tbody>";
      Object.keys(components).forEach(function (k) {
        var st = components[k] && components[k].status ? components[k].status : "?";
        lines += "<tr><td>" + esc(k) + "</td><td class='" + (st === "UP" ? "up" : "down") + "'>" + esc(st) + "</td></tr>";
      });
      lines += "</tbody></table>";
    }
    detailWrap.innerHTML = lines;
  }

  function renderLogs(rows) {
    if (!rows || !rows.length) {
      logsWrap.innerHTML = '<div class="empty">No audit logs yet. Call an API to generate some.</div>';
      return;
    }
    var html = "<table><thead><tr>" +
      "<th>Time</th><th>Actor</th><th>Action / path</th><th>Status</th><th>ms</th><th>Bodies</th>" +
      "</tr></thead><tbody>";
    rows.forEach(function (r) {
      var action = r.path ? ((r.http_method || "") + " " + (r.path || "")) : (r.action || "");
      html += "<tr>" +
        "<td>" + esc(r.created_at) + "</td>" +
        "<td>" + esc(r.actor_type) + "</td>" +
        '<td class="wrap">' + esc(action) + (r.action && r.path ? "<br/><span style='color:#8b9aab'>" + esc(r.action) + "</span>" : "") + "</td>" +
        '<td class="' + codeClass(r.status_code) + '">' + esc(r.status_code == null ? "" : r.status_code) + "</td>" +
        "<td>" + esc(r.duration_ms == null ? "" : r.duration_ms) + "</td>" +
        "<td>" + jsonBlock(r.request_body) + jsonBlock(r.response_body) + "</td>" +
        "</tr>";
    });
    html += "</tbody></table>";
    logsWrap.innerHTML = html;
  }

  function load() {
    SalamaAdminAuth.adminFetch("/api/v1/admin/monitoring/dashboard?logLimit=60")
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        renderCards(data);
        renderCommands(data.recentCommands);
        renderDetail(data);
        renderLogs(data.recentLogs);
        updatedEl.textContent = "Updated " + new Date().toLocaleTimeString();
      })
      .catch(function (err) {
        cardsEl.innerHTML = '<div class="card"><div class="label">Error</div><div class="value down">Failed</div><div class="sub">' + esc(err.message) + "</div></div>";
        logsWrap.innerHTML = '<div class="error">' + esc(err.message) + "</div>";
      });
  }

  function syncTimer() {
    if (timer) clearInterval(timer);
    timer = null;
    if (autoEl.checked) timer = setInterval(load, 5000);
  }

  document.getElementById("btn-refresh").addEventListener("click", load);
  autoEl.addEventListener("change", syncTimer);
  load();
  syncTimer();
})();
  </script>
</body>
</html>
