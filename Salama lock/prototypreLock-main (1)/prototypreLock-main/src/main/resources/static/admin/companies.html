<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Companies &amp; Devices — Salama Lock</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9b6a;
      --border: #2a3542;
      --warn: #c9a227;
      --danger: #d46565;
      --ok: #6fd39a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 70% 45% at 15% -5%, #1a3d2e 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky; top: 0; z-index: 5;
      background: rgba(15, 20, 25, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
    }
    .top {
      max-width: 1100px; margin: 0 auto;
      display: flex; flex-wrap: wrap; gap: 0.75rem 1rem;
      align-items: center; justify-content: space-between;
    }
    .brand { color: var(--accent); font-weight: 650; }
    .links a { color: var(--muted); text-decoration: none; margin-right: 0.85rem; font-size: 0.9rem; }
    .links a:hover { color: var(--accent); }
    main { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
      margin-bottom: 1rem;
    }
    .toolbar button, .toolbar label {
      background: transparent; color: var(--accent);
      border: 1px solid #2a5a42; border-radius: 8px;
      padding: 0.4rem 0.8rem; cursor: pointer; font: inherit; font-size: 0.9rem;
    }
    .toolbar label {
      display: inline-flex; align-items: center; gap: 0.4rem; color: var(--muted);
    }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.7rem;
      margin-bottom: 1.25rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1rem;
    }
    .card .label {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin-bottom: 0.3rem;
    }
    .card .value { font-size: 1.3rem; font-weight: 650; }
    .up { color: var(--ok); }
    .warn { color: var(--warn); }
    .down { color: var(--danger); }
    .company {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .company-head {
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem;
      align-items: flex-start; justify-content: space-between;
    }
    .company-head h2 {
      margin: 0 0 0.25rem;
      font-size: 1.1rem;
    }
    .company-head .code {
      color: var(--accent);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
    }
    .company-meta { color: var(--muted); font-size: 0.85rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .badge {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 0.2rem 0.65rem;
      font-size: 0.78rem;
      color: var(--muted);
      background: #121820;
    }
    .badge strong { color: var(--text); }
    .badge.locked { border-color: #5a3030; color: #f0c4c4; }
    .badge.locked strong { color: #f0c4c4; }
    .badge.unlocked { border-color: #2a5a42; color: var(--ok); }
    .badge.unlocked strong { color: var(--ok); }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th, td {
      text-align: left; padding: 0.55rem 0.85rem;
      border-bottom: 1px solid var(--border); vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #151c24;
    }
    tr:last-child td { border-bottom: none; }
    .empty, .error { padding: 1.25rem; color: var(--muted); }
    .error { color: #f0c4c4; }
    .status-LOCKED { color: var(--danger); font-weight: 650; }
    .status-UNLOCKED, .status-REGISTERED { color: var(--ok); font-weight: 650; }
    .status-DEACTIVATED, .status-UNKNOWN { color: var(--warn); font-weight: 650; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem; }
    .filter {
      margin-left: auto;
      display: flex; gap: 0.4rem; flex-wrap: wrap;
    }
    .filter button {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      font: inherit;
      font-size: 0.85rem;
    }
    .filter button.active {
      background: var(--accent);
      color: #06140c;
      border-color: var(--accent);
      font-weight: 650;
    }
  </style>
  <script src="/admin/admin-auth.js"></script>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand">Salama Lock · Companies &amp; devices</div>
      <div class="links">
        <a href="/">Home</a>
        <a href="/guide">Guide</a>
        <a href="/admin">Issue key</a>
        <a href="/admin/data">Database</a>
        <a href="/admin/monitor">Health &amp; logs</a>
      </div>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btn-refresh">Refresh</button>
      <label><input type="checkbox" id="auto-refresh" /> Auto-refresh (8s)</label>
      <span class="meta" id="last-updated">Not loaded yet</span>
      <div class="filter" id="status-filter">
        <button type="button" class="active" data-filter="ALL">All</button>
        <button type="button" data-filter="LOCKED">Locked</button>
        <button type="button" data-filter="UNLOCKED">Unlocked</button>
        <button type="button" data-filter="DEACTIVATED">Deactivated</button>
      </div>
    </div>

    <div class="cards" id="cards"></div>
    <div id="list"><div class="empty">Loading…</div></div>
  </main>

  <script>
(function () {
  var timer = null;
  var cache = null;
  var filter = "ALL";
  var cardsEl = document.getElementById("cards");
  var listEl = document.getElementById("list");
  var updatedEl = document.getElementById("last-updated");
  var autoEl = document.getElementById("auto-refresh");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }

  function matchesFilter(status) {
    if (filter === "ALL") return true;
    if (filter === "LOCKED") return status === "LOCKED";
    if (filter === "DEACTIVATED") return status === "DEACTIVATED";
    // Unlocked bucket includes REGISTERED (not locked yet)
    return status === "UNLOCKED" || status === "REGISTERED";
  }

  function renderCards(summary) {
    cardsEl.innerHTML =
      '<div class="card"><div class="label">Companies</div><div class="value">' + esc(summary.companies) + "</div></div>" +
      '<div class="card"><div class="label">Devices</div><div class="value">' + esc(summary.devices) + "</div></div>" +
      '<div class="card"><div class="label">Locked</div><div class="value down">' + esc(summary.locked) + "</div></div>" +
      '<div class="card"><div class="label">Unlocked / registered</div><div class="value up">' + esc(summary.unlocked_or_registered) + "</div></div>" +
      '<div class="card"><div class="label">Deactivated</div><div class="value warn">' + esc(summary.deactivated) + "</div></div>";
  }

  function renderList(companies) {
    if (!companies || !companies.length) {
      listEl.innerHTML = '<div class="empty">No companies yet. <a href="/admin" style="color:#3d9b6a">Issue an API key</a> to create one.</div>';
      return;
    }

    var html = "";
    companies.forEach(function (c) {
      var devices = (c.devices || []).filter(function (d) { return matchesFilter(d.status); });
      if (filter !== "ALL" && devices.length === 0) return;

      html += '<section class="company">';
      html += '<div class="company-head">';
      html += "<div><h2>" + esc(c.name) + '</h2>';
      html += '<div class="code">' + esc(c.code) + "</div>";
      html += '<div class="company-meta">Status: ' + esc(c.status) +
        (c.contact_email ? " · " + esc(c.contact_email) : "") +
        " · id " + esc(c.id) + "</div></div>";
      html += '<div class="badges">';
      html += '<span class="badge">Devices <strong>' + esc(c.device_count) + "</strong></span>";
      html += '<span class="badge locked">Locked <strong>' + esc(c.locked_count) + "</strong></span>";
      html += '<span class="badge unlocked">Unlocked/reg <strong>' + esc(c.unlocked_count) + "</strong></span>";
      html += "</div></div>";

      if (!devices.length) {
        html += '<div class="empty">No devices' + (filter === "ALL" ? " registered for this company yet." : " matching this filter.") + "</div>";
      } else {
        html += "<table><thead><tr>" +
          "<th>Status</th><th>IMEI</th><th>Lock ID</th><th>Type</th><th>Model</th><th>Updated</th>" +
          "</tr></thead><tbody>";
        devices.forEach(function (d) {
          var model = [d.manufacturer, d.model].filter(Boolean).join(" ");
          html += "<tr>" +
            '<td class="status-' + esc(d.status) + '">' + esc(d.status) + "</td>" +
            '<td class="mono">' + esc(d.imei) + "</td>" +
            '<td class="mono">' + esc(d.lock_id) + "</td>" +
            "<td>" + esc(d.device_type) + "</td>" +
            "<td>" + esc(model || "—") + "</td>" +
            "<td>" + esc(d.updated_at) + "</td>" +
            "</tr>";
        });
        html += "</tbody></table>";
      }
      html += "</section>";
    });

    if (!html) {
      listEl.innerHTML = '<div class="empty">No companies have devices matching this filter.</div>';
      return;
    }
    listEl.innerHTML = html;
  }

  function paint() {
    if (!cache) return;
    renderCards(cache.summary || {});
    renderList(cache.companies || []);
  }

  function load() {
    SalamaAdminAuth.adminFetch("/api/v1/admin/companies-overview")
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        cache = data;
        paint();
        updatedEl.textContent = "Updated " + new Date().toLocaleTimeString();
      })
      .catch(function (err) {
        listEl.innerHTML = '<div class="error">Failed to load: ' + esc(err.message) + "</div>";
      });
  }

  function syncTimer() {
    if (timer) clearInterval(timer);
    timer = null;
    if (autoEl.checked) timer = setInterval(load, 8000);
  }

  document.getElementById("btn-refresh").addEventListener("click", load);
  autoEl.addEventListener("change", syncTimer);

  document.getElementById("status-filter").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-filter]");
    if (!btn) return;
    filter = btn.getAttribute("data-filter");
    var buttons = document.querySelectorAll("#status-filter button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("active", buttons[i] === btn);
    }
    paint();
  });

  load();
  syncTimer();
})();
  </script>
</body>
</html>
