services:
  postgres:
    image: postgres:16-alpine
    container_name: salama-lock-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - salama-net

  redis:
    image: redis:7-alpine
    container_name: salama-lock-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - salama-net

  app:
    build:
      context: .
      args:
        BUILD_SKIP_TESTS: ${BUILD_SKIP_TESTS:-true}
    image: salama-lock:${APP_IMAGE_TAG:-latest}
    container_name: salama-lock-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      SALAMA_ADMIN_API_KEY: ${SALAMA_ADMIN_API_KEY}
      SALAMA_CALLBACK_SECRET: ${SALAMA_CALLBACK_SECRET}
      ALLOW_IMEI_LOCK: ${ALLOW_IMEI_LOCK:-true}
      PROVIDER_ACTIVE: ${PROVIDER_ACTIVE:-MOCK_GOOGLE_DLC}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -Djava.security.egd=file:/dev/./urandom}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    networks:
      - salama-net

  nginx:
    image: nginx:1.27-alpine
    container_name: salama-lock-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL placeholder — mount certs when enabling HTTPS in nginx.conf
      # - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - salama-net

volumes:
  postgres_data:
  redis_data:

networks:
  salama-net:
    driver: bridge
